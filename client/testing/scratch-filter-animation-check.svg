<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 224" width="800">
  <rect width="100%" height="100%" fill="#0b1120"/>
  <g transform="translate(0 0)">
    <filter id="filter-0" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0">
      <animate attributeName="stdDeviation" from="0" to="8" dur="2s" repeatCount="indefinite"/>
    </feGaussianBlur>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-0)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feGaussianBlur / stdDeviation</text>
  </g>
  <g transform="translate(100 0)">
    <filter id="filter-1" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence baseFrequency="0.05" numOctaves="2" seed="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G">
      <animate attributeName="scale" from="0" to="30" dur="2s" repeatCount="indefinite"/>
    </feDisplacementMap>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-1)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feDisplacementMap / scale</text>
  </g>
  <g transform="translate(200 0)">
    <filter id="filter-2" x="-30%" y="-30%" width="160%" height="160%">
      <feOffset in="SourceGraphic" dx="0" dy="0">
      <animate attributeName="dx" from="0" to="10" dur="2s" repeatCount="indefinite"/>
    </feOffset>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-2)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feOffset / dx</text>
  </g>
  <g transform="translate(300 0)">
    <filter id="filter-3" x="-30%" y="-30%" width="160%" height="160%">
      <feFlood flood-color="#3b82f6" result="flood">
      <animate attributeName="flood-color" from="#3b82f6" to="#ef4444" dur="2s" repeatCount="indefinite"/>
    </feFlood>
    <feComposite in="flood" in2="SourceAlpha" operator="in"/>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-3)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feFlood / flood-color</text>
  </g>
  <g transform="translate(0 112)">
    <filter id="filter-4" x="-30%" y="-30%" width="160%" height="160%">
      <feDiffuseLighting in="SourceAlpha" surfaceScale="2" diffuseConstant="1" lighting-color="#ffffff">
      <fePointLight x="10" y="50" z="30">
        <animate attributeName="x" from="10" to="90" dur="2s" repeatCount="indefinite"/>
      </fePointLight>
    </feDiffuseLighting>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-4)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">fePointLight / x</text>
  </g>
  <g transform="translate(100 112)">
    <filter id="filter-5" x="-30%" y="-30%" width="160%" height="160%">
      <feComponentTransfer in="SourceGraphic">
      <feFuncR type="linear" slope="1">
        <animate attributeName="slope" from="1" to="3" dur="2s" repeatCount="indefinite"/>
      </feFuncR>
    </feComponentTransfer>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-5)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feFuncR / slope</text>
  </g>
  <g transform="translate(200 112)">
    <filter id="filter-6" x="-30%" y="-30%" width="160%" height="160%">
      <feMorphology in="SourceGraphic" operator="dilate" radius="0">
      <set attributeName="radius" to="3" begin="1s" fill="freeze"/>
    </feMorphology>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-6)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feMorphology / radius (set)</text>
  </g>
  <g transform="translate(300 112)">
    <filter id="filter-7" x="-30%" y="-30%" width="160%" height="160%">
      <feDiffuseLighting in="SourceAlpha" surfaceScale="2" diffuseConstant="1" lighting-color="#ffffff">
      <feDistantLight azimuth="0" elevation="45">
        <animate attributeName="azimuth" from="0" to="360" dur="3s" repeatCount="indefinite"/>
      </feDistantLight>
    </feDiffuseLighting>
    </filter>
    <rect width="100" height="100" fill="#111827"/>
    <g filter="url(#filter-7)">
      <circle cx="50" cy="42" r="18" fill="#3b82f6"/>
      <rect x="20" y="62" width="60" height="10" rx="3" fill="#f59e0b"/>
    </g>
    <text x="2" y="108" font-size="6" font-family="sans-serif" fill="#e5e7eb">feDistantLight / azimuth</text>
  </g>
</svg>